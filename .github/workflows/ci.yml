name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password_2026
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov
          
      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: crm
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password_2026
        run: |
          pytest tests/ -v --cov=src --cov=api --cov=ui --cov-report=xml
          
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install linting tools
        run: |
          pip install flake8 black mypy
          
      - name: Run flake8
        run: |
          flake8 src/ api/ ui/ --max-line-length=100 --ignore=E501,W503
          
      - name: Run black
        run: |
          black --check src/ api/ ui/