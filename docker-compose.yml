# CRM Entity Resolution - docker-compose (Streamlit + Postgres + Cloudflare Tunnel)
#
# Deploy (local/cloud VM):
#   docker compose up -d --build
#   docker compose logs -f cloudflared
# Streamlit:    http://localhost:8501
# Tunnel URL:   printed by cloudflared logs (https://xxx.trycloudflare.com)

services:
  streamlit:
    build: .
    container_name: crm-app
    environment:
      # DSN default di tab Database Connection. Host `postgres` = nama service
      # di jaringan compose (127.0.0.1 di dalam container menunjuk dirinya sendiri).
      # Ganti password via .env (lihat .env.example) sebelum go-live.
      DEDUP_DEFAULT_DSN: postgres://crm_owner:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/crm
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Live data/outputs from the repo (gitignored artifacts stay on disk).
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./models:/app/models
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: crm-pg
    environment:
      POSTGRES_USER: crm_owner
      # Ambil dari .env (wajib di-set sebelum go-live). Default devpassword hanya untuk lokal.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Exposes Streamlit to the internet via Cloudflare (no open inbound port needed).
  # Quick tunnel: public URL changes every restart (fine for a demo).
  # Named tunnel: set CLOUDFLARE_TUNNEL_TOKEN + TUNNEL_HOSTNAME (see deploy/README.md).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: crm-tunnel
    depends_on:
      streamlit:
        condition: service_healthy
    command: >
      tunnel
      --no-autoupdate
      --url http://streamlit:8501
      ${CLOUDFLARE_TUNNEL_TOKEN:+--token ${CLOUDFLARE_TUNNEL_TOKEN}}
    restart: unless-stopped

volumes:
  pgdata: