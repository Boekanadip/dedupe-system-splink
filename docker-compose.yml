version: '3.8'

services:
  crm-pg:
    image: postgres:17-alpine
    container_name: crm-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: crm-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=crm-pg
      - POSTGRES_PORT=5432
      - POSTGRES_DB=crm
      - POSTGRES_USER=crm_user
      - POSTGRES_PASSWORD=crm_password_2026
    depends_on:
      crm-pg:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs

  crm-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: crm-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://crm-api:8000
    depends_on:
      - crm-api
    volumes:
      - ./ui:/app/ui

volumes:
  postgres_data:
